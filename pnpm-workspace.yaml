packages:
    - "packages/*"
    # Private, never published, bundled into their consumers. Kept out of
    # `packages/` so that folder means exactly one thing: packages we ship.
    - "internals/*"
    # Test-only, never published. Same reason.
    - "tests/e2e-harness"

# pnpm 10 blocks dependency lifecycle/build scripts by default. node-pty has
# no linux-x64 prebuild, so it must run its `install` (node-gyp) step to
# compile `pty.node`; without this the psql-conformance tab-completion spec
# cannot load it on Linux CI. Allow just that package to build.
onlyBuiltDependencies:
    - node-pty

catalog:
    typescript: ^5.9.0
    vitest: ^3.0.9
    tsdown: ^0.14.1
    "@biomejs/biome": ^2.5.1
    "vite": ^6.4.1
    "@types/node": ^20.19.0
    "@vitest/coverage-v8": ^3.0.9
    console-fail-test: 0.5.0
