<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="referrer" content="no-referrer" />
		<title>You're signed in to Neon</title>
		<link rel="stylesheet" href="./callback.css" />
	</head>
	<body>
		<main>
			<div class="card">
				<header class="success-header">
					<img
						src="./callback-assets/neon.svg"
						width="76"
						height="72"
						alt=""
					/>
					<div>
						<h1>You’re signed in to Neon</h1>
						<p>Head back to the terminal to keep building.</p>
					</div>
				</header>
				<section class="skills" aria-labelledby="skills-title">
					<div class="skills-heading">
						<h2 id="skills-title">
							Add Neon skills to your AI agent
						</h2>
						<div class="agent-icons">
							<img
								src="./callback-assets/claude.svg"
								width="24"
								height="24"
								alt="Claude Code"
								loading="eager"
							/>
							<img
								src="./callback-assets/codex.svg"
								width="24"
								height="24"
								alt="Codex"
								loading="eager"
							/>
							<img
								src="./callback-assets/cursor.svg"
								width="24"
								height="24"
								alt="Cursor"
								loading="eager"
							/>
							<img
								src="./callback-assets/copilot.svg"
								width="24"
								height="24"
								alt="GitHub Copilot"
								loading="eager"
							/>
						</div>
					</div>
					<p class="instructions">
						Paste the prompt into your coding agent.
					</p>
					<div class="actions">
						<button id="copy-prompt" type="button" hidden>
							Copy prompt
						</button>
						<a
							class="docs-link"
							href="https://neon.com/docs/ai/agent-skills"
							target="_blank"
							rel="noopener noreferrer"
						>
							<span>Read the docs</span>
							<span class="sr-only"> (opens in a new tab)</span>
							<span class="arrow" aria-hidden="true"
								><img src="./callback-assets/arrow.svg" alt=""
							/></span>
						</a>
					</div>
					<p id="copy-status" class="copy-status" role="status"></p>
					<div id="manual-copy" class="manual-copy" hidden>
						<label for="prompt"
							>Copy this prompt into your coding agent:</label
						>
						<textarea id="prompt" readonly>
Install the Neon agent skills for this project by following https://neon.com/docs/ai/agent-skills. Then help me connect this project to Neon.</textarea
						>
					</div>
					<noscript
						><p class="instructions">
							Follow the docs to add Neon skills to your coding
							agent.
						</p></noscript
					>
				</section>
			</div>
			<p class="close-hint">You can close this window.</p>
		</main>
		<script>
			const copyButton = document.getElementById("copy-prompt");
			const copyStatus = document.getElementById("copy-status");
			const manualCopy = document.getElementById("manual-copy");
			const prompt = document.getElementById("prompt");
			let resetTimer;

			copyButton.hidden = false;

			copyButton.addEventListener("click", async () => {
				clearTimeout(resetTimer);
				copyButton.disabled = true;
				copyStatus.textContent = "";

				try {
					await navigator.clipboard.writeText(prompt.value);
					manualCopy.hidden = true;
					copyButton.textContent = "Copied!";
					copyStatus.classList.add("sr-only");
					copyStatus.textContent =
						"Prompt copied. Paste it into your coding agent.";
					resetTimer = setTimeout(() => {
						copyButton.textContent = "Copy prompt";
						copyStatus.textContent = "";
					}, 2000);
				} catch {
					copyButton.textContent = "Copy prompt";
					copyStatus.classList.remove("sr-only");
					copyStatus.textContent =
						"Could not copy automatically. Select and copy the prompt below, or read the docs.";
					manualCopy.hidden = false;
					prompt.focus();
					prompt.select();
				} finally {
					copyButton.disabled = false;
				}
			});
		</script>
	</body>
</html>
