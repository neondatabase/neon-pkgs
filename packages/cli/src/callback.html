<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authorization complete | Neon</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f5f7f8;
        color: #1c2024;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100%, 720px);
      }

      .card {
        overflow: hidden;
        border: 1px solid #dfe3e6;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgb(28 32 36 / 8%);
      }

      .authorization,
      .tooling {
        padding: 40px;
      }

      .authorization {
        display: flex;
        gap: 24px;
        align-items: center;
      }

      .logo {
        display: grid;
        flex: 0 0 88px;
        width: 88px;
        height: 88px;
        place-items: center;
        border: 1px solid #dfe3e6;
        border-radius: 50%;
        background: #f8faf9;
      }

      .logo svg {
        width: 50px;
        height: 50px;
      }

      .logo path {
        fill: #00e599;
      }

      .agent-icons {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }

      .agent-icon {
        width: 22px;
        height: 22px;
        flex: none;
        fill: currentColor;
      }

      .agent-icon--claude {
        color: #d97757;
      }

      .agent-divider {
        width: 1px;
        height: 22px;
        background: #dfe3e6;
      }

      .heading {
        margin: 0;
        color: #101213;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .description {
        margin: 12px 0 0;
        color: #687076;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .tooling {
        border-top: 1px solid #e8ebed;
      }

      .tooling h2 {
        margin: 0;
        color: #101213;
        font-size: 1.5rem;
        line-height: 1.25;
        letter-spacing: -0.025em;
      }

      .copy-button {
        min-height: 48px;
        margin-top: 24px;
        padding: 0 20px;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        border: 1px solid #c9d0d4;
        border-radius: 999px;
        background: #ffffff;
        color: #1c2024;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition:
          border-color 120ms ease,
          background-color 120ms ease,
          transform 120ms ease;
      }

      .copy-button:hover {
        border-color: #687076;
        background: #f5f7f8;
      }

      .copy-button:active {
        transform: translateY(1px);
      }

      .copy-button:focus-visible,
      .guide:focus-visible {
        outline: 3px solid rgb(0 229 153 / 35%);
        outline-offset: 3px;
      }

      .copy-button:hover .agent-divider {
        background: #c9d0d4;
      }

      .copy-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .guide {
        width: fit-content;
        margin-top: 22px;
        display: block;
        color: #4f5b62;
        font-weight: 600;
        text-underline-offset: 4px;
      }

      .close-message {
        margin: 20px 0 0;
        color: #7d868c;
        font-size: 0.9rem;
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0c0d0d;
          color: #edeff0;
        }

        .card {
          border-color: #303436;
          background: #191b1c;
          box-shadow: 0 18px 50px rgb(0 0 0 / 35%);
        }

        .logo {
          border-color: #3b4042;
          background: #202423;
        }

        .heading,
        .tooling h2 {
          color: #f4f5f5;
        }

        .description {
          color: #a1a8ac;
        }

        .tooling {
          border-color: #303436;
        }

        .copy-button {
          border-color: #4b5154;
          background: #222526;
          color: #f0f2f2;
        }

        .copy-button:hover {
          border-color: #7d868c;
          background: #292d2e;
        }

        .agent-divider {
          background: #4b5154;
        }

        .copy-button:hover .agent-divider {
          background: #687076;
        }

        .guide {
          color: #bac0c3;
        }

        .close-message {
          color: #7d868c;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 16px;
        }

        .authorization,
        .tooling {
          padding: 28px 24px;
        }

        .authorization {
          align-items: flex-start;
          flex-direction: column;
        }

        .logo {
          width: 72px;
          height: 72px;
          flex-basis: 72px;
        }

        .logo svg {
          width: 40px;
          height: 40px;
        }

        .copy-button {
          width: 100%;
        }
      }
    </style>
  </head>

            <span id="copy-label">Copy prompt</span>
          </button>
          <div class="copy-status" id="copy-status" role="status" aria-live="polite"></div>
          <a class="guide" href="https://neon.com/docs/reference/neon-cli" target="_blank" rel="noreferrer">Or explore the Neon CLI guide</a>
        </section>
      </div>
      <p class="close-message">You can close this window.</p>
    </main>

    <script>
      const prompt = "Fetch the Neon skill from https://neon.com/.well-known/agent-skills/neon/SKILL.md and follow its instructions. Check whether Neon agent skills and the Neon MCP server are already installed for this project, install anything missing, preserve my existing configuration, and summarize every change you make.";
      const copyButton = document.querySelector("#copy-prompt");
      const copyLabel = document.querySelector("#copy-label");
      const copyStatus = document.querySelector("#copy-status");

      const copyWithFallback = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.setAttribute("readonly", "");
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        const copied = document.execCommand("copy");
        textArea.remove();
        if (!copied) throw new Error("Copy failed");
      };

      copyButton.addEventListener("click", async () => {
        try {
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(prompt);
          } else {
            copyWithFallback(prompt);
          }
          copyLabel.textContent = "Copied!";
          copyStatus.textContent = "Prompt copied to clipboard.";
          window.setTimeout(() => {
            copyLabel.textContent = "Copy prompt";
            copyStatus.textContent = "";
          }, 2000);
        } catch {
          copyLabel.textContent = "Copy failed";
          copyStatus.textContent = "Could not copy the prompt. Run neon init in your project instead.";
        }
      });
    </script>
  </body>
</html>
