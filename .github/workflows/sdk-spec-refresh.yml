name: SDK Spec Drift

# Maintainer signal: pull the live Neon OpenAPI spec, regenerate @neon/sdk and
# @neon/tools, and FAIL when the spec or generated files drift from the commit.
# A red run is the signal to refresh locally and open the PR by hand:
#
#   pnpm --filter @neon/sdk spec:pull
#   pnpm --filter @neon/sdk generate
#   pnpm --filter @neon/tools generate
#   pnpm --filter @neon/sdk --filter @neon/tools build
#   # review + update packages/sdk/src/neon/coverage.ts, add a changeset, open a PR

on:
    schedule:
        - cron: "0 9 * * *" # daily 09:00 UTC
    workflow_dispatch: ~

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

jobs:
    drift:
        name: Detect @neon/sdk spec drift
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/prepare

            - name: Pull live OpenAPI spec
              run: pnpm --filter @neon/sdk spec:pull

            - name: Regenerate client
              run: pnpm --filter @neon/sdk generate

            - name: Regenerate tools
              run: pnpm --filter @neon/tools generate

            - name: Build generated packages (typecheck + bundle)
              run: pnpm --filter @neon/sdk --filter @neon/tools build

            - name: Fail when spec or generated packages drifted
              run: |
                  # Stage so the diff also catches newly added / removed generated files.
                  git add -A -- packages/sdk/spec packages/sdk/src/client packages/tools/src/generated packages/tools/src/operations.gen.ts packages/tools/src/schemas.ts
                  if ! git diff --cached --exit-code -- packages/sdk/spec packages/sdk/src/client packages/tools/src/generated packages/tools/src/operations.gen.ts packages/tools/src/schemas.ts; then
                      echo "::error::@neon/sdk or @neon/tools is stale — the live Neon OpenAPI spec drifted from the committed generated packages."
                      echo "Refresh it locally and open a PR:"
                      echo "  pnpm --filter @neon/sdk spec:pull"
                      echo "  pnpm --filter @neon/sdk generate"
                      echo "  pnpm --filter @neon/tools generate"
                      echo "  pnpm --filter @neon/sdk --filter @neon/tools build"
                      echo "Then review packages/sdk/src/neon/coverage.ts (EXPECTED_OPERATIONS / WRAPPED), add a changeset, and open the PR."
                      exit 1
                  fi
                  echo "@neon/sdk and @neon/tools are up to date with the live Neon OpenAPI spec."
