name: Prepare Release

# Stage 1 of the two-stage secure publishing pipeline (mirrors neondatabase/neonctl).
#
# Triggered manually via workflow_dispatch. It:
#   1. Checks the actor has admin/maintain on the repo
#   2. Runs `changeset version` to bump package versions + update changelogs,
#      consuming the pending .changeset/*.md files
#   3. Opens a signed release PR via peter-evans/create-pull-request using a
#      GitHub App token (so the PR triggers the required-check workflows, which
#      a GITHUB_TOKEN-opened PR would not)
#
# What this does NOT do:
#   - Build / pack / scan / publish — those are Stage 2.
#
# Stage 2 lives in databricks/secure-public-registry-releases-eng and is
# triggered manually against the per-package tags created by post-release.yml.
# It builds + scans the artifacts and publishes the npm packages via OIDC
# Trusted Publishing (plus the GitHub releases). We do NOT build or publish
# from this public repo, and no npm token lives here.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to release from (default: main). Raw SHAs not supported."
        required: false
        type: string
        default: "main"

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  prepare:
    runs-on:
      group: neondatabase-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the release PR
      id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      # Open the PR with a GitHub App token: App-opened PRs trigger the
      # required-check workflows; GITHUB_TOKEN-opened PRs do not. The private
      # key is only consumed by this step — it is never placed in the shell
      # environment of later steps (e.g. the dependency install below).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check actor has admin/maintain role
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          role=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq '.role_name')
          if [[ "$role" != "admin" && "$role" != "maintain" ]]; then
            echo "::error::Actor '${GITHUB_ACTOR}' has role '${role}', but 'admin' or 'maintain' is required to dispatch a release."
            exit 1
          fi
          echo "Actor ${GITHUB_ACTOR} passes gate (role: ${role})."

      - name: Validate ref input
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          REF="${REF_INPUT:-main}"
          if [[ "$REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::Raw SHA refs are not supported. Use a branch name (e.g. 'main')."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0 # full history so changesets + changelog generation work

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Needed to run @changesets/cli (a locked devDependency). pnpm 10 blocks
      # dependency lifecycle scripts by default, and the App token is not in the
      # environment here, so this install is low-risk despite running in the
      # protected runner group.
      - name: Install dependencies
        uses: ./.github/actions/prepare

      - name: Apply changesets (version bump + changelogs)
        id: version
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::error::No pending changesets in .changeset/. Run 'pnpm changeset' on a feature PR before releasing."
            exit 1
          fi
          pnpm exec changeset version
          if git diff --quiet; then
            echo "::error::'changeset version' produced no changes — nothing to release."
            exit 1
          fi
          echo "Changesets applied. Changed files:"
          git --no-pager diff --name-only
          {
            echo "### Release contents"
            echo ""
            echo "Files updated by \`changeset version\`:"
            echo ""
            git --no-pager diff --name-only | while IFS= read -r f; do echo "- \`${f}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create signed commit + open release PR
        id: cpr
        # Commits via the GitHub Contents API → verified-signature commit.
        # Uses the App token so the PR triggers required checks. Auto-merge is
        # NOT enabled (see PR body for why).
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: "chore: release packages"
          branch: release-pr/neon-pkgs-${{ github.run_id }}
          base: main
          title: "chore: release packages"
          labels: release
          draft: always-true
          delete-branch: false
          body: |
            Automated release cut by `prepare-release.yml` (run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            Versions + changelogs were bumped by `changeset version` from the pending changesets.

            ### Next steps
            1. Click **Ready for review** (GitHub won't merge a draft).
            2. An approver reviews + approves.
            3. Required checks run.
            4. On green, the approver **manually clicks "Squash and merge"** in the UI. **Do NOT use auto-merge.**
            5. `post-release.yml` fires on the push to `main`, tags each bumped package `name@version`, and comments here with Stage 2 (npm + GitHub release) dispatch instructions.

            > :warning: **Why manual merge?** GitHub Actions suppresses downstream `on: push` workflows for pushes attributed to `GITHUB_TOKEN` (including auto-merge from a workflow). A human clicking merge attributes the push to that user, so `post-release.yml` fires.

            > :warning: **Do not edit this PR's title** — `post-release.yml` gates on the squash-commit subject starting with `chore: release packages`.

      - name: Summarize PR
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OP: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          echo "Opened/updated: ${PR_URL} (${PR_OP})"
          {
            echo "### PR"
            echo "${PR_URL} (${PR_OP})"
          } >> "$GITHUB_STEP_SUMMARY"
