name: Type Check Distribution

on:
    pull_request: ~
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    typecheck-dist:
        name: Check ${{ matrix.name }} distributed types
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        strategy:
            matrix:
                include:
                    - name: neon-new
                      dir: neon-new
                    - name: vite-plugin-neon-new
                      dir: vite-plugin-neon-new
                    - name: "@neondatabase/config"
                      dir: config
                    - name: "@neondatabase/env"
                      dir: env
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare

            - name: Build ${{ matrix.name }} package and dependencies
              # build the package and all its dependencies
              run: pnpm --filter ${{ matrix.name }}... build

            - name: Check types with @arethetypeswrong/cli
              # Pinned to the 0.18.x line (matches @arethetypeswrong/core in pnpm-lock.yaml) so CI
              # no longer pulls @latest. Stronger follow-up: add @arethetypeswrong/cli to
              # devDependencies so it is integrity-pinned in the lockfile and run via `pnpm exec`.
              run: pnpx @arethetypeswrong/cli@^0.18.0 --pack packages/${{ matrix.dir }} --profile esm-only
