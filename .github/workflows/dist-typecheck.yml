name: Type Check Distribution

on:
    pull_request: ~
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

jobs:
    typecheck-dist:
        name: Check ${{ matrix.name }} distributed types
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        strategy:
            matrix:
                include:
                    - name: neon-new
                      dir: neon-new
                    - name: vite-plugin-neon-new
                      dir: vite-plugin-neon-new
                    - name: "@neon/config"
                      dir: config
                    - name: "@neon/config-runtime"
                      dir: config-runtime
                    - name: "@neon/env"
                      dir: env
                    - name: "@neon/functions"
                      dir: functions
                    - name: "@neon/ai-sdk-provider"
                      dir: ai-sdk-provider
                    - name: "@neon/tools"
                      dir: tools
                    - name: "@neon/sdk"
                      dir: sdk
                    - name: "@neon/effect"
                      dir: effect
                    - name: "@neon/realtime"
                      dir: realtime
                    - name: "@neon/realtime-react"
                      dir: realtime-react
                    - name: "@neon/realtime-tanstack"
                      dir: realtime-tanstack
                    - name: "@neon/realtime-drizzle"
                      dir: realtime-drizzle
                    - name: "@neon/realtime-kysely"
                      dir: realtime-kysely
                    - name: "@neon/auth"
                      dir: auth
                      # The consumer compile is skipped: better-auth's own published
                      # .d.ts files do not survive a skipLibCheck:false compile, and
                      # Next ships no exports map, so `next/server` is unresolvable
                      # under moduleResolution=nodenext. Neither reflects a defect in
                      # this package's emitted declarations. See issue #765.
                      skipConsumerCompile: true
                    - name: "@neon/postgrest-js"
                      dir: postgrest-js
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare

            - name: Build ${{ matrix.name }} package and dependencies
              # build the package and all its dependencies
              run: pnpm --filter ${{ matrix.name }}... build

            - name: Check types with @arethetypeswrong/cli
              run: pnpm exec attw --pack packages/${{ matrix.dir }} --profile esm-only

            - name: Compile declarations as a consumer
              if: ${{ !matrix.skipConsumerCompile }}
              run: pnpm exec node scripts/check-dist-types.mjs packages/${{ matrix.dir }}
