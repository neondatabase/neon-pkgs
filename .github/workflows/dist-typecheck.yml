name: Type Check Distribution

on:
    pull_request: ~
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

jobs:
    typecheck-dist:
        name: Check ${{ matrix.name }} distributed types
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        strategy:
            matrix:
                include:
                    - name: neon-new
                      dir: neon-new
                    - name: vite-plugin-neon-new
                      dir: vite-plugin-neon-new
                    - name: "@neondatabase/config"
                      dir: config
                    - name: "@neondatabase/config-runtime"
                      dir: config-runtime
                    - name: "@neondatabase/env"
                      dir: env
                    - name: "@neondatabase/functions"
                      dir: functions
                    - name: "@neondatabase/ai-sdk-provider"
                      dir: ai-sdk-provider
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: ./.github/actions/prepare

            - name: Build ${{ matrix.name }} package and dependencies
              # build the package and all its dependencies
              run: pnpm --filter ${{ matrix.name }}... build

            - name: Check types with @arethetypeswrong/cli
              run: pnpm exec attw --pack packages/${{ matrix.dir }} --profile esm-only
