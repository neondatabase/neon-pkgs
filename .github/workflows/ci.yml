jobs:
    build:
        name: Build
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - run: pnpm build
            # `pnpm build` compiles neonctl via tsconfig.build.json, which
            # excludes *.test.ts. Type-check the full source (tsconfig.json
            # includes src/**/*.ts, i.e. tests) so type regressions in cli test
            # files can't slip through — no other CI job type-checks them.
            - run: pnpm --filter neonctl typecheck
    lint:
        name: Lint
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - run: pnpm lint:ci
    test:
        name: Test
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - run: pnpm test:ci --coverage
            - if: always()
              uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4

name: CI

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

on:
    pull_request: ~
    push:
        branches:
            - main
