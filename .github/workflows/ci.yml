jobs:
    build:
        name: Build
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/prepare
            - run: pnpm build
    lint:
        name: Lint
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/prepare
            - run: pnpm lint:ci
    tools-node-24:
        name: Tools (Node 24)
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/prepare
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - run: pnpm --filter @neon/tools test:ci
            - run: pnpm --filter @neon/tools build
    test:
        name: Test (${{ matrix.name }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: CLI 1/4
                      suite: cli
                      shard: 1
                      upload: cli-1-of-4
                    - name: CLI 2/4
                      suite: cli
                      shard: 2
                      upload: cli-2-of-4
                    - name: CLI 3/4
                      suite: cli
                      shard: 3
                      upload: cli-3-of-4
                    - name: CLI 4/4
                      suite: cli
                      shard: 4
                      upload: cli-4-of-4
                    - name: non-CLI packages
                      suite: non-cli
                      shard: 0
                      upload: non-cli
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/prepare
            - if: matrix.suite == 'cli'
              run: pnpm --filter neon test:ci --coverage --coverage.reporter=json --shard=${{ matrix.shard }}/4
            - if: matrix.suite == 'cli' && matrix.shard == 4
              run: pnpm --filter neonctl test:ci --coverage --coverage.reporter=json
            - if: matrix.suite == 'non-cli'
              run: pnpm --recursive --filter='./packages/**' --filter='!neon' --filter='!neonctl' test:ci --coverage --coverage.reporter=json
            - name: Collect coverage
              run: |
                  for report in packages/*/coverage/coverage-final.json; do
                      package_dir=${report#packages/}
                      package=${package_dir%%/*}
                      mkdir -p "coverage-upload/$package"
                      cp "$report" "coverage-upload/$package/coverage-final.json"
                  done
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: coverage-${{ matrix.upload }}
                  path: coverage-upload
    coverage:
        name: Coverage
        needs: test
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: coverage
                  pattern: coverage-*
            - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  fail_ci_if_error: true
                  slug: neondatabase/neon-pkgs
                  use_oidc: true

name: CI

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

on:
    pull_request: ~
    push:
        branches:
            - main
