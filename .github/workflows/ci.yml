jobs:
    changes:
        name: Detect affected packages
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        outputs:
            all: ${{ steps.affected.outputs.all }}
            packages: ${{ steps.affected.outputs.packages }}
            dirs: ${{ steps.affected.outputs.dirs }}
            tools: ${{ steps.affected.outputs.tools }}
            e2e_live: ${{ steps.affected.outputs.e2e_live }}
            e2e_auth: ${{ steps.affected.outputs.e2e_auth }}
            e2e_gateway: ${{ steps.affected.outputs.e2e_gateway }}
            psql: ${{ steps.affected.outputs.psql }}
            matrix: ${{ steps.matrix.outputs.matrix }}
            has-tests: ${{ steps.matrix.outputs.has-tests }}
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0 # the affected-package diff needs the base branch history
            - uses: ./.github/actions/prepare
              with:
                  install: 'false'
            - id: affected
              uses: ./.github/actions/affected
              with:
                  workflow: .github/workflows/ci.yml
                  suite: ${{ github.event.inputs.suite || 'all' }}
                  e2e: 'true'
            - id: matrix
              env:
                  CLI: ${{ steps.affected.outputs.cli }}
                  DIRS: ${{ steps.affected.outputs.dirs }}
                  CLI_SHARDS: 4 # the neon test suite is split across this many runners
              run: |
                  matrix=$(jq -cn --arg cli "$CLI" --argjson dirs "$DIRS" --argjson shards "$CLI_SHARDS" '
                      (if $cli == "true"
                         then [range(1; $shards + 1) | {name: "CLI \(.)/\($shards)", suite: "cli", shard: ., shards: $shards, upload: "cli-\(.)-of-\($shards)"}]
                         else [] end)
                      + (if any($dirs[]; . != "cli" and . != "neonctl")
                         then [{name: "non-CLI packages", suite: "non-cli", shard: 0, shards: 0, upload: "non-cli"}]
                         else [] end)
                      | {include: .}')
                  {
                      echo "matrix=$matrix"
                      echo "has-tests=$(jq -r '.include | length > 0' <<<"$matrix")"
                  } | tee -a "$GITHUB_OUTPUT"
    build:
        name: Build
        needs: changes
        if: needs.changes.outputs.packages != '[]'
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - name: Build affected packages and their dependencies
              env:
                  ALL: ${{ needs.changes.outputs.all }}
                  PACKAGES: ${{ needs.changes.outputs.packages }}
              run: |
                  if [[ "$ALL" == true ]]; then
                      pnpm build
                  else
                      mapfile -t filters < <(jq -r '.[] | "--filter=\(.)..."' <<<"$PACKAGES")
                      pnpm "${filters[@]}" build
                  fi
    lint:
        name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.suite || 'all') == 'all' }}
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - run: pnpm lint:ci
    tools-node-24:
        name: Tools (Node 24)
        needs: changes
        if: needs.changes.outputs.all == 'true' || needs.changes.outputs.tools == 'true'
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24
            - run: pnpm --filter @neon/tools test:ci
            - run: pnpm --filter @neon/tools build
    test:
        name: Test (${{ matrix.name }})
        needs: changes
        if: needs.changes.outputs.has-tests == 'true'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - if: matrix.suite == 'cli'
              run: pnpm --filter neon test:ci --coverage --coverage.reporter=json --shard=${{ matrix.shard }}/${{ matrix.shards }}
            - if: matrix.suite == 'cli' && matrix.shard == matrix.shards
              run: pnpm --filter neonctl test:ci --coverage --coverage.reporter=json
            - if: matrix.suite == 'non-cli'
              env:
                  DIRS: ${{ needs.changes.outputs.dirs }}
              run: |
                  mapfile -t filters < <(jq -r '.[] | select(. != "cli" and . != "neonctl") | "--filter=./packages/\(.)"' <<<"$DIRS")
                  pnpm --recursive "${filters[@]}" test:ci --coverage --coverage.reporter=json
            - name: Collect coverage
              run: |
                  shopt -s nullglob
                  for report in packages/*/coverage/coverage-final.json; do
                      package_dir=${report#packages/}
                      package=${package_dir%%/*}
                      mkdir -p "coverage-upload/$package"
                      cp "$report" "coverage-upload/$package/coverage-final.json"
                  done
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  # CLI shards always produce coverage; the non-CLI entry may match packages without tests.
                  if-no-files-found: ${{ matrix.suite == 'cli' && 'error' || 'ignore' }}
                  name: coverage-${{ matrix.upload }}
                  path: coverage-upload
    coverage:
        name: Coverage
        needs: test
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: coverage
                  pattern: coverage-*
            # Only packages with coverage data are uploaded: a flag uploaded without data would
            # blank that package instead of letting carryforward keep its last result.
            - id: packages
              run: |
                  packages=$(find coverage -mindepth 2 -maxdepth 2 -type d -printf '%f\n' 2>/dev/null | sort -u | paste -sd' ' -)
                  echo "packages=$packages" | tee -a "$GITHUB_OUTPUT"
            # Fetches and signature-checks the Codecov CLI and mints the OIDC token (exported as
            # CC_TOKEN) without uploading; the upload step below reuses both.
            - if: steps.packages.outputs.packages != ''
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              env:
                  CC_BINARY_LOCATION: ${{ runner.temp }}/codecov
                  CC_DOWNLOAD_ONLY: true
              with:
                  fail_ci_if_error: true
                  use_oidc: true
            # Codecov treats one upload as one session, and carryforward cleanup deletes a
            # carried-forward flag's whole session whenever any incoming flag matches it.
            # Each package is therefore uploaded on its own with exactly its flag (every CLI
            # shard's report goes under `cli`), in one job so the runner pool is not multiplied.
            - if: steps.packages.outputs.packages != ''
              env:
                  PACKAGES: ${{ steps.packages.outputs.packages }}
              run: |
                  shopt -s nullglob
                  args=(upload-coverage --fail-on-error --git-service github --slug neondatabase/neon-pkgs --disable-search)
                  # The action stores the OIDC token JSON-encoded (wrapped in double quotes) and
                  # unquotes it with `eval echo` in its own wrapper; strip the quotes the same way.
                  token=${CC_TOKEN:-}
                  token=${token#\"}
                  token=${token%\"}
                  [[ -z "$token" ]] || args+=(--token "$token")
                  [[ -z "${CC_SHA:-}" ]] || args+=(--sha "$CC_SHA")
                  [[ -z "${CC_PR:-}" ]] || args+=(--pr "$CC_PR")
                  [[ -z "${CC_BRANCH:-}" ]] || args+=(--branch "$CC_BRANCH")

                  status=0
                  for package in $PACKAGES; do
                      files=()
                      for report in coverage/*/"$package"/coverage-final.json; do
                          files+=(--file "$report")
                      done
                      echo "::group::Upload $package"
                      "$RUNNER_TEMP/codecov/codecov" "${args[@]}" --flag "$package" "${files[@]}" || status=1
                      echo "::endgroup::"
                  done
                  exit "$status"

    # The e2e jobs wait for lint, build, and unit tests so a broken change never spends
    # live-API budget; Actions has no job priority, so `needs` is the only ordering lever.

    # Calls the real Neon Management API: creates Postgres projects, mutates branches, and
    # deletes everything again, against the throwaway "neon-pkgs Integration Test Org"
    # (NEON_TEST_API_KEY, an org-scoped key). Never point that secret at an org holding
    # anything worth keeping: the suite sweeps stale `neon-ts-e2e-*` projects on start.
    e2e-live:
        name: Live Neon e2e
        needs: [changes, lint, build, test]
        # A skipped dependency (no tests or build needed) must not skip this job. A failed one blocks it
        # except on the nightly, where one flaky lint or unit failure must not hide every live suite.
        # Fork and Dependabot pull requests get no repository secrets, so the suite could only fail there.
        if: >-
            ${{ !cancelled() && (github.event_name == 'schedule' || !failure()) &&
            needs.changes.outputs.e2e_live == 'true' &&
            (github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]')) }}
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        timeout-minutes: 20
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            # One suite at a time: they share a single org, and running them in
            # parallel multiplies the project churn for no wall-clock gain.
            - name: Run live e2e suites
              env:
                  NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
                  NEON_ORG_ID: ${{ vars.NEON_TEST_ORG_ID }}
              run: pnpm test:e2e:live

    # Provisions a throwaway project, enables Neon Auth on its default branch with email
    # verification off (so headless signups succeed), and deletes both afterwards. Separate
    # from e2e-live so auth provisioning and real signups only spend budget when @neon/auth
    # (or the harness) is affected.
    e2e-auth:
        name: Live Neon Auth e2e
        needs: [changes, lint, build, test]
        # A skipped dependency (no tests or build needed) must not skip this job. A failed one blocks it
        # except on the nightly, where one flaky lint or unit failure must not hide every live suite.
        # Fork and Dependabot pull requests get no repository secrets, so the suite could only fail there.
        if: >-
            ${{ !cancelled() && (github.event_name == 'schedule' || !failure()) &&
            needs.changes.outputs.e2e_auth == 'true' &&
            (github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]')) }}
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        timeout-minutes: 20
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - name: Run live Neon Auth e2e
              env:
                  NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
                  NEON_ORG_ID: ${{ vars.NEON_TEST_ORG_ID }}
              run: pnpm --filter @neon/auth test:e2e

    # Calls real models: the capability matrix exercises one representative per gateway route
    # family, and the SDK-version matrix generates text with every model the branch serves on
    # AI SDK 6 and 7, well over a hundred inference requests per run. That is why it only runs
    # when @neon/ai-sdk-provider is affected. No gateway credentials are stored: global setup
    # creates a throwaway project in the integration test org, mints a branch credential
    # scoped to `ai_gateway:invoke`, and deletes both afterwards. Model access is granted per
    # account, so every project in that org sees the same catalog.
    e2e-gateway:
        name: Live AI Gateway e2e
        needs: [changes, lint, build, test]
        # A skipped dependency (no tests or build needed) must not skip this job. A failed one blocks it
        # except on the nightly, where one flaky lint or unit failure must not hide every live suite.
        # Fork and Dependabot pull requests get no repository secrets, so the suite could only fail there.
        if: >-
            ${{ !cancelled() && (github.event_name == 'schedule' || !failure()) &&
            needs.changes.outputs.e2e_gateway == 'true' &&
            (github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]')) }}
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        timeout-minutes: 30
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare
            - name: Run live AI Gateway e2e
              env:
                  NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
                  NEON_ORG_ID: ${{ vars.NEON_TEST_ORG_ID }}
              run: pnpm --filter @neon/ai-sdk-provider test:e2e

    # Drives packages/cli/tests/psql-conformance against the TypeScript psql, using upstream
    # PostgreSQL regression scripts vendored under fixtures/upstream/<PG_TAG>/ (pinned in
    # POSTGRES_REF) so no public source checkout is needed at run time. Neon supports PG
    # 14-18; 19beta1 tracks upstream psql parity ahead of server GA. The harness boots its
    # own postgres via @testcontainers/postgresql, which the runner group's Docker supports.
    # A failing row fails the run, but `main` has no required status checks, so it does not
    # block merging. Per-subtest deferred work is tracked inline in the spec files via
    # it.todo/it.skip (see the suite README).
    psql-conformance:
        name: psql-conformance (pg-${{ matrix.pg }})
        needs: [changes, lint, build, test]
        # A skipped dependency (no tests or build needed) must not skip this job. A failed one blocks it
        # except on the nightly, where one flaky lint or unit failure must not hide every live suite.
        if: ${{ !cancelled() && (github.event_name == 'schedule' || !failure()) && needs.changes.outputs.psql == 'true' }}
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        # A row takes about 8 minutes; without a limit a hung row holds a runner for the 6-hour default.
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                pg: ["14", "15", "16", "17", "18", "19beta1"]
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: ./.github/actions/prepare

            # `...` force-builds neon's workspace deps too; neon's tsc needs their dist/ output.
            - name: Build neon (+ deps)
              run: pnpm --filter neon... build

            - name: Run conformance suite
              working-directory: packages/cli
              env:
                  # dist/psql/cli.js is the standalone psql shim: the yargs CLI (dist/cli.js)
                  # intercepts libpq flags like -v, so the harness routes through the shim.
                  PSQL_BINARY: ${{ github.workspace }}/packages/cli/dist/psql/cli.js
                  # Opt in to the TAP-style integration specs (they self-skip otherwise, see
                  # tap/_helpers.ts:RUN_INTEGRATION).
                  RUN_INTEGRATION: "1"
                  # Pins the testcontainers image to this row's PG major; pg-fixture.ts boots
                  # it with the full seed + bind-mount and probes the server major from it.
                  PGCONFORMANCE_PG_IMAGE: postgres:${{ matrix.pg }}
              run: |
                  set -o pipefail
                  # The log lands where the suite's .gitignore already excludes *.log, so a
                  # stray local run never gets committed.
                  pnpm test:conformance 2>&1 \
                    | tee tests/psql-conformance/psql-conformance.log

            - name: Upload conformance log
              if: always()
              uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
              with:
                  # Artifact names must be unique within a run.
                  name: psql-conformance-pg-${{ matrix.pg }}
                  path: packages/cli/tests/psql-conformance/psql-conformance.log
                  if-no-files-found: warn
                  retention-days: 14

    nightly-failure:
        name: Report nightly failure
        needs:
            - changes
            - build
            - lint
            - tools-node-24
            - test
            - coverage
            - e2e-live
            - e2e-auth
            - e2e-gateway
            - psql-conformance
        # A job stopped by its timeout reports `cancelled`, so a hung suite counts as a failure.
        # `!cancelled()` is false only when the whole run was cancelled, which is not a failure.
        if: ${{ !cancelled() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        permissions:
            issues: write
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
              with:
                  egress-policy: audit

            - name: Open or update the nightly-ci issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  set -euo pipefail

                  list_jobs() {
                      jq -r --arg result "$1" 'to_entries | map(select(.value.result == $result) | "- `" + .key + "`") | join("\n")' <<<"$NEEDS"
                  }
                  body="The scheduled CI run failed: $RUN_URL"
                  failed=$(list_jobs failure)
                  cancelled=$(list_jobs cancelled)
                  [[ -z "$failed" ]] || body+=$'\n\nFailed jobs:\n'"$failed"
                  [[ -z "$cancelled" ]] || body+=$'\n\nCancelled jobs (usually a timeout):\n'"$cancelled"

                  gh label create nightly-ci --force --color B60205 --description "Failed scheduled CI run"
                  issue=$(gh issue list --label nightly-ci --state open --limit 1 --json number --jq '.[0].number // empty')
                  if [[ -n "$issue" ]]; then
                      gh issue comment "$issue" --body "$body"
                  else
                      gh issue create --title "Nightly CI failed" --label nightly-ci --body "$body"
                  fi

name: CI

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

# Push, schedule, and dispatch runs are keyed on run_id and never cancel each other, so a
# pending main run is never replaced; the cost is that a burst of merges runs every affected
# live suite in full for each of them.
concurrency:
    group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
    pull_request: ~
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            suite:
                description: Run one live suite on its own, or everything
                type: choice
                default: all
                options:
                    - all
                    - e2e-live
                    - e2e-auth
                    - e2e-gateway
                    - psql-conformance
    # Pushes and pull requests run only the live suites their changes affect and skip psql
    # conformance unless the psql code changed; the nightly run is the backstop that runs
    # every one of them. A failed nightly opens or updates a `nightly-ci` issue.
    schedule:
        - cron: "0 6 * * *"
