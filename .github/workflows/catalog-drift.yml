name: Catalog Drift

# Maintainer guard: fails when @neon/ai-sdk-provider's pinned model
# catalog (NEON_MODELS_DEV_IDS) drifts from https://neon.com/models.json.

on:
    schedule:
        - cron: "0 9 * * 1" # Mondays 09:00 UTC
    workflow_dispatch: ~

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

jobs:
    drift:
        name: neon.com/models.json catalog drift
        runs-on:
            group: databricks-ghec-untrusted-runner-group
            labels: linux-ubuntu-latest-untrusted-2core-8gb
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/prepare
            - run: pnpm --filter @neon/ai-sdk-provider test:drift
