# psql conformance harness (packages/cli).
#
# Drives packages/cli/tests/psql-conformance against the TypeScript psql
# implementation, using upstream PostgreSQL regression scripts as ground
# truth. The scripts are VENDORED under
# packages/cli/tests/psql-conformance/fixtures/upstream/<PG_TAG>/ (pinned
# in POSTGRES_REF, currently REL_19_BETA1) so no public egress is needed at
# test time — the protected runner group can only reach the JFrog mirror.
#
# MATRIX: Neon supports PG 14-18; we also exercise 19beta1 to track upstream
# psql parity ahead of the server GA. Per-subtest deferred work is tracked
# inline in the spec files via it.todo/it.skip — see the suite README.
#
# BLOCKING: green across the matrix, so failures gate merge. The harness
# boots its own postgres via @testcontainers/postgresql (Docker is available
# on the runner group — the existing Test job already uses testcontainers for
# the *.integration.test.ts suites).

name: psql conformance

on:
    pull_request:
        paths:
            - "packages/cli/src/psql/**"
            - "packages/cli/tests/psql-conformance/**"
            - ".github/workflows/psql-conformance.yml"
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write # mint the JFrog OIDC token in ./.github/actions/prepare

# Cancel superseded runs on the same ref so re-pushed branches do not pile
# up matrix jobs.
concurrency:
    group: psql-conformance-${{ github.ref }}
    cancel-in-progress: true

jobs:
    psql-conformance:
        name: psql-conformance (pg-${{ matrix.pg }})
        runs-on:
            group: neondatabase-protected-runner-group
            labels: linux-ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                pg: ["14", "15", "16", "17", "18", "19beta1"]

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/prepare

            - name: Build neon (+ deps)
              # `...` force-builds neon's workspace deps too (matches
              # dist-typecheck.yml); neon's tsc needs their dist/ output.
              run: pnpm --filter neon... build

            - name: Run conformance suite
              working-directory: packages/cli
              env:
                  # dist/psql/cli.js is the standalone psql shim — the yargs
                  # CLI (dist/cli.js) intercepts libpq flags like -v, so the
                  # harness routes through the shim.
                  PSQL_BINARY: ${{ github.workspace }}/packages/cli/dist/psql/cli.js
                  # Opt in to the TAP-style integration specs (they self-skip
                  # otherwise — see tap/_helpers.ts:RUN_INTEGRATION).
                  RUN_INTEGRATION: "1"
                  # Pin the testcontainers image to this matrix row's PG major;
                  # pg-fixture.ts boots it with the full seed + bind-mount and
                  # probes the server major from the running container.
                  PGCONFORMANCE_PG_IMAGE: postgres:${{ matrix.pg }}
              run: |
                  set -o pipefail
                  # Log lands under tests/psql-conformance/ where the suite's
                  # .gitignore already excludes *.log, so a stray local run
                  # never gets committed.
                  pnpm test:conformance 2>&1 \
                    | tee tests/psql-conformance/psql-conformance.log

            - name: Upload conformance log
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  # Artifact names must be unique within a run; suffix with the
                  # matrix PG major.
                  name: psql-conformance-pg-${{ matrix.pg }}
                  path: packages/cli/tests/psql-conformance/psql-conformance.log
                  if-no-files-found: warn
                  retention-days: 14
